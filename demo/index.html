n class="primary" data-action="save-profile">Save availability</button><button class="secondary" data-action="toggle-calendar">${me.calendar?'Disconnect demo calendar':'Preview calendar connection'}</button>`;}else if(state.page==='conversation'){const c=contact(state.activeContact);main.innerHTML=`<button class="back" data-match-tab="messages">← Messages</button><div class="thread-heading"><img src="${photos[c.photo]}" alt="Demo portrait"><div><h2>${esc(c.name)}</h2><p>${esc(c.company)}</p></div></div><div class="thread">${thread(c.id).map(m=>`<div class="bubble ${m.from==='me'?'outgoing':'incoming'}">${esc(m.text)}</div>`).join('')}</div><label for="message-draft">Message</label><textarea id="message-draft" rows="3" placeholder="Write a message…"></textarea><button class="primary" data-action="send-local">Send in preview</button><button class="secondary" data-page="booking">Schedule a meeting</button>`;}else if(state.page==='connection'){const c=contact(state.activeContact);main.innerHTML=`<button class="back" data-match-tab="connections">← Connections</button><div class="thread-heading"><img src="${photos[c.photo]}" alt="Demo portrait"><div><h2>${esc(c.name)}</h2><p>${esc(c.role)} · ${esc(c.company)}</p></div></div>${matchSection(vc)}<button class="primary" data-conversation="${c.id}">Open conversation</button><button class="secondary" data-page="booking">Schedule a meeting</button>`;}else if(state.page==='meeting-detail'){const m=appointments().find(x=>x.id===state.activeMeeting)||appointments()[0];const c=contact(m.contact);main.innerHTML=`<button class="back" data-match-tab="scheduled">← Scheduled meetings</button><h1>Your coffee chat</h1><div class="thread-heading"><img src="${photos[c.photo]}" alt="Demo portrait"><div><h2>${esc(c.name)}</h2><p>${esc(c.company)}</p></div></div><div class="meeting-facts"><strong>${dateLabel(m.day,{weekday:'long',day:'numeric',month:'long'})}</strong><span>${m.slot} · 20 minutes · Europe/Rome</span><span>Google Meet · Confirmed c',month:'long',year:'numeric'})} · ${state.slot}<br>20 minutes · Google Meet · Europe/Rome</p><button class="primary" data-page="booking">Change time</button>`;}else if(state.page==='message'){main.innerHTML='<button class="back" data-page="match">← Your match</button><h1>Say hello.</h1><label for="bc-message">Message to Marco</label><textarea id="bc-message" rows="6" placeholder="What would you like to explore together?"></textarea>';}else{main.innerHTML=`<button class="back" data-page="discover">← Discover</button><h1>A closer look.</h1><p class="muted">${vc?'Giulia Russo, CEO · ex-Enel X · 2× founder':'Recent focus: energy efficiency and the built environment'}</p><p class="muted">${name} · ${vc?'Lumen Grid':'Northlight Ventures'}</p><div class="settings"><div class="setting"><span>Sector</span><span>Climate · B2B SaaS</span></div><div class="setting"><span>Stage</span><span>Seed</span></div><div class="setting"><span>Ticket</span><span>€250k–750k</span></div></div><p class="mini-label">Worth discussing: ${vc?'revenue retention and growth':'lead capacity and investment process'}.</p><button class="primary" data-action="like">Connect</button>`;}if(globalThis.lucide)lucide.createIcons({attrs:{width:20,height:20}});}function commit(a){if(a==='pass'){state.index=(state.index+1)%3;state.saved=false;state.page='discover';}if(a==='undo'){state.index=(state.index+2)%3;state.page='discover';}if(a==='save')state.saved=!state.saved;if(a==='like'){state.page='match';state.matchTab='new';}render();persist();}async function motion(el,frames,options){if(!el?.animate||reduced())return;try{await el.animate(frames,options).finished;}catch{}}async function act(a){if(busy)return;const card=main.querySelector('.swipe');if(card&&(a==='pass'||a==='like'||a==='undo')){busy=true;const dir=a==='pass'?-1:1;const start=card.style.transform||'translateX(0) rotate(0deg)';const stamp=card.querySelector('.swipe-label');if(stamp){stamp.textContent=a==='like'?'LET’S TALK':a==='pass'?'PASS':'BACK';stamp.style.opacity=1;}await motion(card,[{transform:start,opacity:1},{transform:'translateX('+dir*480+'px) rotate('+dir*19+'deg)',opacity:0}],{duration:320,easing:'cubic-bezier(.4,0,.9,.5)',fill:'forwards'});commit(a);const next=main.querySelector('.swipe')||main;await motion(next,[{transform:'translateY(18px) scale(.96)',opacity:.4},{transform:'translateY(-3px) scale(1.006)',opacity:1,offset:.78},{transform:'translateY(0) scale(1)',opacity:1}],{duration:390,easing:'cubic-bezier(.2,.75,.25,1)'});busy=false;}else commit(a);}async function rebound(card){const start=card.style.transform;card.style.transform='';card.querySelector('.swipe-label').style.opacity=0;await motion(card,[{transform:start},{transform:'translateX(-7px) rotate(-.5deg)',offset:.65},{transform:'translateX(0) rotate(0)'}],{duration:390,easing:'cubic-bezier(.2,.8,.2,1)'});}root.addEventListener('submit',e=>e.preventDefault());root.addEventListener('click',e=>{if(busy)return;if(suppressClick){suppressClick=false;return;}const b=e.target.closest('button');if(!b)return;if(b.dataset.matchTab){state.matchTab=b.dataset.matchTab;state.page='match';render();persist();return;}if(b.dataset.conversation){state.activeContact=b.dataset.conversation;state.page='conversation';render();persist();return;}if(b.dataset.contact){state.activeContact=b.dataset.contact;state.page='connection';render();persist();return;}if(b.dataset.meeting){state.activeMeeting=b.dataset.meeting;state.page='meeting-detail';render();persist();return;}if(b.dataset.reschedule){const m=appointments().find(x=>x.id===b.dataset.reschedule);state.rescheduleId=m.id;state.activeContact=m.contact;state.day=m.day;state.dateStart=m.day;state.slot=m.slot;state.page='booking';render();persist();return;}if(b.dataset.action==='send-local'){const draft=main.querySelector('#message-draft');if(!draft.value.trim())return;thread(state.activeContact).push({from:'me',text:draft.value.trim()});render();persist();return;}if(b.dataset.page==='confirmed'){const list=appointments();const entry={id:state.rescheduleId||'local-'+Date.now(),contact:state.activeContact||'marco',day:state.day,slot:state.slot,status:'Confirmed'};const found=list.findIndex(m=>m.id===entry.id);if(found>=0)list[found]=entry;else list.push(entry);state.rescheduleId=null;}if(b.dataset.action==='save-profile'){const fields=Array.from(main.querySelectorAll('[data-field]'));const invalid=fields.find(f=>['name','company','location','sectors','stage','markets'].includes(f.dataset.field)&&!f.value.trim());if(invalid){invalid.setCustomValidity('Please complete this field.');invalid.reportValidity();invalid.addEventListener('input',()=>invalid.setCustomValidity(''),{once:true});return;}fields.forEach(f=>own()[f.dataset.field]=f.value.trim());state.page='profile';render();persist();return;}if(b.dataset.action==='save-visibility'){const selected=main.querySelector('input[name="profile-visibility"]:checked');if(selected)own().visibility=selected.value;state.page='profile';render();persist();return;}if(b.dataset.action==='toggle-calendar'){main.querySelectorAll('[data-field]').forEach(f=>own()[f.dataset.field]=f.value.trim());own().calendar=!own().calendar;render();persist();return;}if(b.dataset.action){act(b.dataset.action);return;}if(b.dataset.page)state.page=b.dataset.page;if(b.dataset.shift){state.dateStart=addDays(state.dateStart,Number(b.dataset.shift));state.day=state.dateStart;state.slot=slotsFor(state.day)[0];}if(b.dataset.day){state.day=b.dataset.day;state.slot=slotsFor(state.day)[0];}if(b.dataset.slot)state.slot=b.dataset.slot;render();persist();});root.addEventListener('pointerdown',e=>{const card=e.target.closest('.swipe');if(busy||!card||e.target.closest('button')||e.button!==0)return;drag={x:e.clientX,y:e.clientY,card,id:e.pointerId,dx:0,locked:false};});root.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.locked&&Math.abs(dy)>Math.abs(dx)+8){drag=null;return;}if(Math.abs(dx)>10&&!drag.locked){drag.locked=true;drag.card.setPointerCapture(e.pointerId);}if(!drag.locked)return;drag.dx=dx;drag.card.style.transform=`translateX(${Math.max(-120,Math.min(120,dx))}px) rotate(${dx/22}deg)`;const stamp=drag.card.querySelector('.swipe-label');stamp.textContent=dx>0?'CONNECT':'PASS';stamp.classList.toggle('stamp-pass',dx<0);stamp.style.opacity=Math.min(1,Math.abs(dx)/70);});function finish(e){if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;if(Math.abs(d.dx)>65){suppressClick=true;setTimeout(()=>{suppressClick=false;},0);act(d.dx>0?'like':'pass');}else{rebound(d.card);}}root.addEventListener('pointerup',finish);root.addEventListener('pointercancel',()=>{if(drag){rebound(drag.card);drag=null;}});role.addEventListener('change',()=>{state.role=role.value;state.page='discover';state.index=0;render();persist();});window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.modelContent;if(s?.version===16){Object.assign(state,s);render();}});render();})();
